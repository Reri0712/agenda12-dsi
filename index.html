<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres para aceitar acentuação -->
    <meta charset="UTF-8">
    <!-- Configura a responsividade para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Garante compatibilidade com navegadores antigos -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Título exibido na aba do navegador -->
    <title>Meus sites favoritos</title>
</head>
<body>

    <!-- Título principal do corpo da página com o seu nome -->
    <h1>Meus sites favoritos: Renato</h1>

    <!-- 1º Site: GitHub -->
    <h2>GitHub</h2>
    <figure>
        <img src="github.png" alt="Logo do GitHub" width="200">
        <figcaption>Fonte: (GitHub, 2026)</figcaption>
    </figure>
    <a href="https://github.com" target="_blank">Acessar o GitHub</a>

    <hr>

    <!-- 2º Site: YouTube -->
    <h2>YouTube</h2>
    <figure>
        <img src="youtube.png" alt="Logo do YouTube" width="200">
        <figcaption>Fonte: (YouTube, 2026)</figcaption>
    </figure>
    <a href="https://www.youtube.com" target="_blank">Acessar o YouTube</a>

    <hr>

    <!-- 3º Site: Google -->
    <h2>Google</h2>
    <figure>
        <img src="google.png" alt="Logo do Google" width="200">
        <figcaption>Fonte: (Google, 2026)</figcaption>
    </figure>
    <a href="https://www.google.com" target="_blank">Acessar o Google</a>

    <hr>

    <!-- 4º Site: Amazon -->
    <h2>Amazon</h2>
    <figure>
        <img src="amazon.png" alt="Logo da Amazon" width="200">
        <figcaption>Fonte: (Amazon, 2026)</figcaption>
    </figure>
    <a href="https://www.amazon.com.br" target="_blank">Acessar a Amazon</a>

    <hr>

    <!-- 5º Site: Canva -->
    <h2>Canva</h2>
    <figure>
        <img src="canva.jpg" alt="Logo do Canva" width="200">
        <figcaption>Fonte: (Fonte: Canva, 2026)</figcaption>
    </figure>
    <a href="https://www.canva.com" target="_blank">Acessar o Canva</a>

</body>
</html>
